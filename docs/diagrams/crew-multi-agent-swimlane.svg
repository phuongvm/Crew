<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crew-swimlane-title crew-swimlane-desc">
  <title id="crew-swimlane-title">Multi-Agent Swimlane Choreography Across Crew Roles</title>
  <desc id="crew-swimlane-desc">Swimlane diagram across four horizontal lanes showing how Commander, Coordinator (@leader), Worker (@coder/@designer), and Verifier (@reviewer) collaborate from intake through TDD implementation and 3D independent proof verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- =================================================================
       SWIMLANE BANDS & LABELS (4 lanes, 4px grid)
       Lane 1 (Commander):   y=24..152
       Lane 2 (Coordinator): y=152..288
       Lane 3 (Worker):      y=288..424
       Lane 4 (Verifier):    y=424..560
       ================================================================= -->
  <line x1="24" y1="24" x2="976" y2="24" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="24" y1="152" x2="976" y2="152" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="24" y1="288" x2="976" y2="288" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="24" y1="424" x2="976" y2="424" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="24" y1="560" x2="976" y2="560" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="140" y1="24" x2="140" y2="560" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <text x="36" y="84" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COMMANDER</text>
  <text x="36" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">Human Principal</text>

  <text x="36" y="216" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COORDINATOR</text>
  <text x="36" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">@leader (intake)</text>

  <text x="36" y="352" fill="#eb6c36" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKER</text>
  <text x="36" y="368" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">@coder / @designer</text>

  <text x="36" y="488" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VERIFIER</text>
  <text x="36" y="504" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">@reviewer (audit)</text>

  <!-- =================================================================
       ARROWS FIRST (Orthogonal r=8, >=6px mask gap)
       ================================================================= -->

  <!-- 1. Step 1 (Commander x=240, y=116) -> Step 2 (Coordinator x=240, y=176) -->
  <line x1="240" y1="116" x2="240" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- 2. Step 2 (Coordinator x=320, y=216) -> Step 3 (Coordinator x=380, y=216) -->
  <line x1="320" y1="216" x2="380" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="328" y="196" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="350" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INPUTS</text>

  <!-- 3. Step 3 (Coordinator bottom x=460, y=256) -> Step 4 (Worker top x=460, y=312) -->
  <line x1="460" y1="256" x2="460" y2="312" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="472" y="272" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="508" y="280" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

  <!-- 4. Step 4 (Worker right x=540, y=352) -> Step 5 (Worker left x=580, y=352) -->
  <line x1="540" y1="352" x2="580" y2="352" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- 5. Step 5 (Worker bottom x=660, y=392) -> Step 6 (Verifier top x=660, y=448) -->
  <line x1="660" y1="392" x2="660" y2="448" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="672" y="408" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="706" y="416" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDOFF</text>

  <!-- 6. Step 6 (Verifier right x=740, y=488) -> Step 7 (Coordinator bottom x=860, y=256) -->
  <path d="M 740 488 L 852 488 Q 860 488 860 480 L 860 256" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="764" y="468" width="76" height="12" rx="2" fill="#f5f5f5"/>
  <text x="802" y="476" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS (RC=0)</text>

  <!-- 7. Step 7 (Coordinator top x=860, y=176) -> Step 8 (Commander bottom x=860, y=116) -->
  <line x1="860" y1="176" x2="860" y2="116" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- =================================================================
       STEP BOXES (8 nodes total, 4px grid)
       ================================================================= -->

  <!-- Node 1: Commander Ask / Grilling (x=160, y=44, w=160, h=72) -->
  <rect x="160" y="44" width="160" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="160" y="44" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="240" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1. Ask &amp; Frontier OK</text>
  <text x="240" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/crew-no-spec or /crew</text>
  <text x="240" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Answers Q1..Qn defaults</text>

  <!-- Node 2: Coordinator Explore (x=160, y=176, w=160, h=80) -->
  <rect x="160" y="176" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="160" y="176" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="240" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2. Explore &amp; Synthesize</text>
  <text x="240" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Graphify + diagnosing-bugs</text>
  <text x="240" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">grilling + codebase-design</text>
  <text x="240" y="248" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Write Exploration Doc</text>

  <!-- Node 3: Coordinator Contract & Split (x=380, y=176, w=160, h=80) -->
  <rect x="380" y="176" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="176" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="460" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3. Contract &amp; Watcher</text>
  <text x="460" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">to-tickets vertical slices</text>
  <text x="460" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">crew_card_create / split</text>
  <text x="460" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">watch --card &lt;id&gt; --md</text>

  <!-- Node 4 (Focal Coral): Worker TDD & Seam Build (x=380, y=312, w=160, h=80) -->
  <rect x="380" y="312" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="312" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="460" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4. Worktree &amp; TDD</text>
  <text x="460" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">crew_worktree_create</text>
  <text x="460" y="368" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Red-&gt;Green at public seam</text>
  <text x="460" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Graphify get_neighbors</text>

  <!-- Node 5: Worker Verdict & PR Handoff (x=580, y=312, w=160, h=80) -->
  <rect x="580" y="312" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="580" y="312" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="660" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5. Verdict &amp; Handoff</text>
  <text x="660" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">crew_verdict (exit 0)</text>
  <text x="660" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Before-&gt;After + Blast door</text>
  <text x="660" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">crew_review_handoff</text>

  <!-- Node 6 (Focal Coral): Verifier 3D & Anti-Tautology Audit (x=580, y=448, w=160, h=80) -->
  <rect x="580" y="448" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="580" y="448" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="660" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6. Independent Audit</text>
  <text x="660" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Re-run crew_verdict + Zero-CO</text>
  <text x="660" y="504" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3D Spec + Anti-Tautology</text>
  <text x="660" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Graphify get_pr_impact</text>

  <!-- Node 7: Coordinator Watcher Wake (x=780, y=176, w=160, h=80) -->
  <rect x="780" y="176" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="780" y="176" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="860" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7. Audit &amp; Closeout</text>
  <text x="860" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Watcher wakes session</text>
  <text x="860" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/crew: sync-specs &amp; archive</text>
  <text x="860" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/crew-no-spec: optional sync</text>

  <!-- Node 8: Commander Executive Debrief (x=780, y=44, w=160, h=72) -->
  <rect x="780" y="44" width="160" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="780" y="44" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="860" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">8. Executive Debrief</text>
  <text x="860" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Done / Not Done / Blocked</text>
  <text x="860" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Proof rc=0 + Commit SHAs</text>

  <!-- =================================================================
       LEGEND STRIP (Bottom horizontal strip, y=580..628)
       ================================================================= -->
  <text x="36" y="604" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="120" y="596" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="144" y="604" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Focal Execution &amp; Verification Gates</text>

  <rect x="400" y="596" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="424" y="604" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Coordinator / Role Step</text>

  <rect x="612" y="596" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="636" y="604" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Commander Touchpoint</text>

  <line x1="808" y1="600" x2="832" y2="600" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="840" y="604" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Kanban Handoff</text>
</svg>
