<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crew-intake-flow-title crew-intake-flow-desc">
  <title id="crew-intake-flow-title">Unified Intake Decision Flow (/crew-no-spec vs /crew)</title>
  <desc id="crew-intake-flow-desc">Flowchart showing how a Commander request routes through Mode 2 Guided Discovery (Graphify MCP, Matt Pocock diagnosing-bugs or grilling, and OpenSpec Exploration Document persistence) or Mode 1 Fast-Path directly into either /crew-no-spec card dispatch or /crew OpenSpec governance.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- =================================================================
       ARROWS FIRST (Orthogonal r=8, 4px grid, 6-10px label mask gap)
       ================================================================= -->

  <!-- 1. Start Oval (x=480, y=24..72) -> Decision 1 Diamond (x=480, y=112..192) -->
  <line x1="480" y1="72" x2="480" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2. Decision 1 (Need Discovery?) YES (left exit x=400, y=152) -> Discovery Box (x=180, y=220) -->
  <path d="M 400 152 L 188 152 Q 180 152 180 160 L 180 220" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="240" y="132" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="296" y="140" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODE 2: EXPLORE</text>

  <!-- 3. Decision 1 (Need Discovery?) NO / ALREADY EXPLORED (bottom exit x=480, y=192) -> Merge Dot (x=480, y=380) -->
  <line x1="480" y1="192" x2="480" y2="376" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="492" y="264" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="556" y="272" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODE 1: FAST-PATH</text>

  <!-- 4. Discovery Box (bottom x=180, y=316) -> Exploration Doc Box (top x=180, y=348) -->
  <line x1="180" y1="316" x2="180" y2="348" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- 5. Exploration Doc Box (right exit x=320, y=380) -> Merge Dot (x=476, y=380) -->
  <line x1="320" y1="380" x2="476" y2="380" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="348" y="360" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="396" y="368" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INPUTS READY</text>

  <!-- 6. Merge Dot (x=480, y=384) -> Decision 2 Diamond (x=480, y=416..496) -->
  <line x1="480" y1="384" x2="480" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7. Decision 2 (Command Track?) /crew-no-spec (left exit x=400, y=456) -> Track B Box (x=220, y=516) -->
  <path d="M 400 456 L 228 456 Q 220 456 220 464 L 220 516" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="256" y="436" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="312" y="444" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/CREW-NO-SPEC</text>

  <!-- 8. Decision 2 (Command Track?) /crew (right exit x=560, y=456) -> Track A Box (x=740, y=516) -->
  <path d="M 560 456 L 732 456 Q 740 456 740 464 L 740 516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="596" y="436" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="644" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/CREW (SPEC)</text>

  <!-- 9. Track B Box (right x=360, y=556) -> Execution Box (left x=420, y=556) -->
  <line x1="360" y1="556" x2="420" y2="556" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- 10. Track A Box (left x=600, y=556) -> Execution Box (right x=540, y=556) -->
  <line x1="600" y1="556" x2="540" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- =================================================================
       NODES (4px grid, max 8 nodes, 2 coral focal elements)
       ================================================================= -->

  <!-- Node 1: Start Oval (x=360, y=24, w=240, h=48) -->
  <rect x="360" y="24" width="240" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="360" y="24" width="240" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="480" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commander Chat or Slash</text>
  <text x="480" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Explore topic | /crew-no-spec | /crew</text>

  <!-- Node 2: Decision 1 Diamond (center 480, 152; w=160, h=80 -> points 480,112 560,152 480,192 400,152) -->
  <polygon points="480,112 560,152 480,192 400,152" fill="#f5f5f5"/>
  <polygon points="480,112 560,152 480,192 400,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Need Discovery?</text>
  <text x="480" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">root cause / seams</text>

  <!-- Node 3: Guided Discovery Engine (x=40, y=220, w=280, h=96) -->
  <rect x="40" y="220" width="280" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="220" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="48" y="228" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="76" y="236" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
  <text x="180" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auto-Routed Discovery Loop</text>
  <text x="180" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1. Graphify MCP (&lt;2s AST/hubs)</text>
  <text x="180" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2. Bug -&gt; diagnosing-bugs (&lt;5s probe)</text>
  <text x="180" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3. Feature -&gt; grilling + codebase-design</text>

  <!-- Node 4: Exploration Document Store (x=40, y=348, w=280, h=64) -->
  <rect x="40" y="348" width="280" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="348" width="280" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="48" y="356" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="70" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOC</text>
  <text x="180" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Exploration Document (to-spec)</text>
  <text x="180" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">openspec/workspace/explorations/*.md</text>

  <!-- Merge Point Dot (x=480, y=380, r=4) -->
  <circle cx="480" cy="380" r="4" fill="#2d3142"/>

  <!-- Node 5: Decision 2 Diamond (center 480, 456; w=160, h=80 -> points 480,416 560,456 480,496 400,456) -->
  <polygon points="480,416 560,456 480,496 400,456" fill="#f5f5f5"/>
  <polygon points="480,416 560,456 480,496 400,456" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="480" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spec Track?</text>
  <text x="480" y="468" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">slash command</text>

  <!-- Node 6 (Focal Coral): Track B /crew-no-spec (x=80, y=516, w=280, h=80) -->
  <rect x="80" y="516" width="280" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="516" width="280" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="88" y="524" width="60" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="118" y="532" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRACK B</text>
  <text x="220" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fast-Track Card (/crew-no-spec)</text>
  <text x="220" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Skips proposal/specs/design/tasks</text>
  <text x="220" y="584" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Inputs: Exploration Doc + to-tickets</text>

  <!-- Node 7: Track A /crew Full OpenSpec (x=600, y=516, w=280, h=80) -->
  <rect x="600" y="516" width="280" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="516" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="608" y="524" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="638" y="532" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRACK A</text>
  <text x="740" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenSpec Governance (/crew)</text>
  <text x="740" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">propose -&gt; @reviewer audit -&gt; Gate</text>
  <text x="740" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sync-specs -&gt; archive (Commander OK)</text>

  <!-- Node 8: End Oval — Verified Kanban Execution (x=420, y=528, w=120, h=56) -->
  <rect x="420" y="528" width="120" height="56" rx="24" fill="#f5f5f5"/>
  <rect x="420" y="528" width="120" height="56" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="480" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Crew Kanban</text>
  <text x="480" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TDD + Verifier</text>

  <!-- =================================================================
       LEGEND STRIP (Bottom horizontal strip, y=624..668)
       ================================================================= -->
  <line x1="40" y1="620" x2="960" y2="620" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="644" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="120" y="636" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="144" y="644" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Focal Track (/crew-no-spec)</text>

  <rect x="336" y="636" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="360" y="644" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Engine / Governance Step</text>

  <rect x="548" y="636" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="572" y="644" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Durable Artifact Store</text>

  <line x1="740" y1="640" x2="764" y2="640" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="772" y="644" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Discovery &amp; Inputs Flow</text>
</svg>
